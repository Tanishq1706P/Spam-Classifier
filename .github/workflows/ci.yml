name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install pyspark==3.5.3 fastapi uvicorn pyyaml pytest pytest-cov httpx
      - run: python cluster/gen_error_docs.py && git diff --exit-code docs/errors.md   # code used but undocumented -> fail
      - run: bash -n cluster/*.sh
      - run: python -m pytest -q --cov=src
